{% extends "core/base.html" %}

{% block title %}Connexion - {{ site_settings.short_name }}{% endblock %}

{% block content %}
<section class="login-section">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-6 col-lg-5">
        <div class="login-card shadow rounded-4" data-aos="fade-up">
          <div class="text-center mb-4">
            <span class="login-icon"><i class="bi bi-person-circle"></i></span>
            <h1 class="login-title">Connexion</h1>
          </div>
          {% if form.errors %}
          <div class="alert alert-danger py-2">Nom d'utilisateur ou mot de passe incorrect.</div>
          {% endif %}
          <form method="post">
            {% csrf_token %}
            <div class="mb-3">
              <label for="id_username" class="form-label">Nom d'utilisateur</label>
              <input type="text" name="username" id="id_username" class="form-control" autofocus required>
            </div>
            <div class="mb-4">
              <label for="id_password" class="form-label">Mot de passe</label>
              <input type="password" name="password" id="id_password" class="form-control" required>
            </div>
            <input type="hidden" name="next" value="{{ next }}">
            <button type="submit" class="btn btn-primary w-100 rounded-pill">Se connecter</button>
          </form>
          <p class="text-center mt-3 mb-0">
            <a href="{% url 'home' %}" class="login-back"><i class="bi bi-arrow-left me-1"></i>Retour à l'accueil</a>
          </p>
        </div>
      </div>
    </div>
  </div>
</section>
{% endblock %}
