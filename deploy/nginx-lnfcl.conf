server {
    listen 80;
    server_name _;

    client_max_body_size 160M;

    location /static/ {
        alias /opt/lnfcl/staticfiles/;
        expires 30d;
        access_log off;
    }

    location /media/ {
        alias /opt/lnfcl/media/;
        expires 7d;
        access_log off;
    }

    location / {
        include proxy_params;
        proxy_pass http://unix:/run/lnfcl.sock;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
