<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>En maintenance — {{ site_settings.short_name|default:"LNFCL" }}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0f2a63, #0ea5e9);
      color: #fff;
    }
    .maintenance-card {
      text-align: center;
      padding: 3rem 2rem;
      max-width: 560px;
    }
    .maintenance-icon { font-size: 4rem; margin-bottom: 1.5rem; }
  </style>
</head>
<body>
  <div class="maintenance-card">
    <div class="maintenance-icon"><i class="bi bi-tools"></i></div>
    <h1 class="mb-3">{{ site_settings.name|default:"LNFCL" }}</h1>
    <p class="lead mb-4">{{ message|default:"Sit la gen reparasyon kounye a. Tanpri tounen pi pita. Mèsi!" }}</p>
    <a href="/connexion/" class="btn btn-light btn-lg rounded-pill px-4">Konekte</a>
  </div>
</body>
</html>
